    <script>
      // Applies the stored theme before first paint so there is no light flash in dark mode.
      try {
        var stored = JSON.parse(localStorage.getItem('athlytic.theme') || '{}');
        var preference = (stored.state && stored.state.preference) || 'system';
        var dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var color = dark ? '#0d0f0e' : '#f7f5f0';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', color); });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
